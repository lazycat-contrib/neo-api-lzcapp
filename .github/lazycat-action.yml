version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/neo-api.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: neo-api

build:
  toolchains: []
  run_buildscript: false

images:
  - id: neo-api
    target: service
    service: neo-api
    source: docker.io/pengzhile/new-api
    channel: stable
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: false
    changelog_locales: [zh, en]
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Neo API
    summary: Published from GitHub Actions
